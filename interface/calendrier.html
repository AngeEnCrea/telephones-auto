<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub · Téléphones</title>
<link rel="stylesheet" href="i/style.css">
<style>
  :root{--orange:#ff9f0a;--orange-2:rgba(255,159,10,.14)}
  /* le hub (hub.js) : la santé des pages, les téléphones, les alertes, au-dessus du calendrier */
  .hub{padding:16px 22px 4px;display:flex;flex-direction:column;gap:14px}
  .tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .tuile{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;min-width:0}
  .tuile .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
  .tuile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:3px 0 2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .tuile .v small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
  .tuile .s{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
  .tuile .etats span{display:inline-flex;align-items:center;gap:5px}
  .ko{color:var(--urgent)} .ok-t{color:var(--ok)}
  .pastille{width:8px;height:8px;border-radius:50%;background:var(--ink-4);display:inline-block;flex:none}
  .pastille.ok{background:var(--ok)} .pastille.orange{background:var(--orange)} .pastille.rouge{background:var(--urgent);box-shadow:0 0 0 3px var(--urgent-2)}
  .hub-corps{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .page{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .page.rouge{border-color:rgba(255,69,58,.4)} .page.orange{border-color:rgba(255,159,10,.35)}
  .page>header{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
  .page h3{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em}
  .cpt{padding:10px 13px;border-top:1px solid var(--line)}
  .page>header+.cpt{border-top:0}
  .cpt .l1{display:flex;align-items:center;gap:7px;min-width:0}
  .cpt .l1 a{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cpt .l1 a:hover{text-decoration:underline}
  .cpt .plat{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);flex:none}
  .badge{font-size:10px;padding:2px 7px;border-radius:99px;white-space:nowrap;flex:none}
  .badge.chauffe{background:var(--orange-2);color:var(--orange)} .badge.ko{background:var(--urgent-2);color:var(--urgent)}
  .cpt .chiffres{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:7px 0 3px}
  .cpt .chiffres small{color:var(--ink-4)}
  .cpt em{font-style:normal;font-size:11px;margin-left:2px} .cpt em.plus{color:var(--ok)} .cpt em.moins{color:var(--urgent)}
  .cpt .jour-c{font-size:12px;color:var(--ink-3)}
  .cpt .raisons{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .cpt .raisons li{font-size:12px;line-height:1.35;padding:6px 8px;border-radius:var(--r-sm);background:var(--urgent-2);color:#ffb3ad}
  .cpt.orange .raisons li{background:var(--orange-2);color:#ffd08a}
  .courbe rect{fill:var(--surface-4)} .courbe rect.der{fill:var(--info)}
  .alertes{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;max-height:420px;overflow:auto}
  .alertes h2{margin:0 0 8px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .alerte{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;line-height:1.35;padding:6px 0;border-top:1px solid var(--line)}
  .alerte:first-of-type{border-top:0}
  .alerte .h{color:var(--ink-4);white-space:nowrap;font-variant-numeric:tabular-nums}
  .alerte.rouge span:last-child{color:#ffb3ad} .alerte.orange span:last-child{color:#ffd08a}
  .hub-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sec-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 22px 0}
  .sec-tete h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  @media (max-width:1180px){.hub-corps{grid-template-columns:1fr}.alertes{max-height:260px}}
  a.tuile:hover{border-color:var(--line-3)}
  /* les vues des pages (vues.js), entre le hub et le calendrier */
  .vues{padding:18px 22px 0;display:flex;flex-direction:column;gap:10px}
  .vues-tete{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .vues-tete h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .vues-tete b{color:var(--ink);font-weight:650}
  .v-graphe{display:block;height:auto}
  .v-graphe .tt,.v-legende i.tt{fill:var(--info);background:var(--info)} .v-graphe .ig,.v-legende i.ig{fill:#bf5af2;background:#bf5af2}
  .v-graphe text{font-size:10px;fill:var(--ink-4);text-anchor:middle} .v-graphe text.lun{fill:var(--ink-2);font-weight:700}
  .v-legende{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
  .v-legende i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .v-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .v-carte{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow-x:auto}
  .v-carte h3{margin:0 0 6px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .v-carte .btn{margin-top:8px}
  .tv{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tv th{text-align:right;font-weight:500;color:var(--ink-3);padding:5px 6px;white-space:nowrap}
  .tv td{text-align:right;padding:5px 6px;border-top:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
  .tv th:first-child,.tv td:first-child{text-align:left}
  .tv td b{color:var(--ink);font-weight:650}
  .tv tr.auj td{background:var(--info-2)}
  .tv small{color:var(--ink-4);font-size:10.5px}
  .v-note{margin:0}
  @media (max-width:900px){.v-tables{grid-template-columns:1fr}}
  .cal-tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cal-info{padding:10px 22px 0;color:var(--ink-3);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .cal-info b{color:var(--ink-2);font-weight:600}
  .cal-info a.lien{color:var(--info)}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:14px 22px 30px}
  @media (max-width:980px){.cal{grid-template-columns:1fr}}
  .jour{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);min-height:200px;display:flex;flex-direction:column}
  .jour.auj{border-color:var(--info)}
  .jour.passe{opacity:.62}
  .jour h3{margin:0;padding:10px 12px 8px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line)}
  .jour h3 .n{font-size:11px;color:var(--ink-4);font-weight:500;margin-left:auto}
  .jour .liste{padding:8px;display:flex;flex-direction:column;gap:7px}
  .ent{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:left}
  .ent:hover{border-color:var(--line-3)}
  .ent{position:relative}
  .ent .suppr{position:absolute;top:4px;right:4px;font-size:13px;line-height:1;padding:4px 5px;border-radius:6px;background:var(--surface-3);opacity:.75;cursor:pointer}
  .ent .suppr:hover{opacity:1;background:var(--urgent-2)}
  .ent img,.ent .sans{width:34px;height:60px;object-fit:cover;border-radius:6px;background:var(--surface-3)}
  .ent .h{font-size:12px;font-weight:700;letter-spacing:-.01em}
  .ent .t{font-size:12px;color:var(--ink-2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:2px 0 4px}
  .ent .g{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
  .reseaux{display:flex;gap:4px;flex-wrap:wrap}
  .res{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
  .res.en_attente{background:var(--info-2);color:var(--info)}
  .res.en_cours{background:var(--warn-2);color:var(--warn)}
  .res.publie{background:var(--ok-2);color:var(--ok)}
  .res.echec{background:var(--urgent-2);color:var(--urgent)}
  .ent.echec{border-color:rgba(255,69,58,.45)}
  .ent.en_cours{border-color:rgba(255,214,10,.45)}
  .libre{font-size:11px;color:var(--ink-4);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:6px 8px}
  .vide{font-size:12px;color:var(--ink-4);padding:6px 4px}
  .legende{display:flex;gap:6px;align-items:center}
  .fiche-cal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .fiche-cal[hidden]{display:none}
  .fiche-cal .boite{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-md);padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
  .fiche-cal h2{margin:0 0 4px;font-size:16px}
  .fiche-cal .compte{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .fiche-cal .compte .grow{min-width:0}
  .fiche-cal .err{color:var(--urgent);font-size:12px;margin-top:2px}
  .fiche-cal .lien{color:var(--info);font-size:12px;word-break:break-all}
  .corbeille-item{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
  .corbeille-item .grow{min-width:0;overflow-wrap:anywhere}
  .corbeille-item p{margin:4px 0;color:var(--ink-3);font-size:12px}
  .corbeille-item .btn{flex:none}
  /* dans l'onglet Calendrier d'un projet du centre (?seul=1) : rien que le calendrier */
  body.seul .barre,body.seul .hub,body.seul .vues{display:none}
  body.seul .sec-tete{padding-top:6px}
  /* le projet principal | un autre projet (26/10/2026) : le projet regardé, pour tout l'onglet */
  .choix-projet{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
  .choix-projet button{background:none;border:0;color:var(--ink-3);font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer}
  .choix-projet button.on{background:var(--surface-4);color:var(--ink)}
  /* façon planificateur (25/10/2026) : la colonne « À programmer » à droite du calendrier, les créneaux libres où poser */
  .cal-corps{display:grid;grid-template-columns:minmax(0,1fr)}
  body.avec-ap .cal-corps{grid-template-columns:minmax(0,1fr) 270px}
  .ap{display:none}
  body.avec-ap .ap{display:flex;flex-direction:column;gap:7px;padding:14px 22px 30px 0;max-height:calc(100vh - 40px);overflow:auto;position:sticky;top:0;align-self:start}
  .ap h2{margin:0;font-size:13px;font-weight:650;display:flex;gap:6px;align-items:baseline}
  .ap h2 .n{font-size:11px;color:var(--ink-4);font-weight:500;margin-left:auto}
  .ap p{margin:0 0 4px}
  .apv{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);cursor:grab}
  .apv:hover{border-color:var(--line-3)} .apv.deja{opacity:.6} .apv.prise{border-color:var(--info);box-shadow:0 0 0 2px var(--info-2)}
  .apv img,.apv .sans{width:34px;height:60px;object-fit:cover;border-radius:6px;background:var(--surface-3)}
  .apv .t{font-size:12px;color:var(--ink);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:2px}
  .apv .leg{font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.3}
  .apv .gen{margin-top:5px;font-size:11px;padding:4px 8px}
  .ap .opt{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);cursor:pointer}
  .libre .pose{display:none}
  .essai-heure{margin:6px 8px 0;font-size:11px;color:#d6a4ff;background:none;border:1px dashed rgba(191,90,242,.55);border-radius:var(--r-sm);padding:5px 8px;cursor:pointer;text-align:left}
  .essai-heure:hover{background:rgba(191,90,242,.1)}
  .pose-active .ent.cible-version{border-color:rgba(191,90,242,.8);box-shadow:0 0 0 2px rgba(191,90,242,.18)}
  .ent.cible-version.survol{background:rgba(191,90,242,.12)}
  .pose-active .libre.cible{border-color:var(--info);color:var(--info);cursor:copy}
  .pose-active .libre.cible .pose{display:inline}
  .libre.cible.survol{background:var(--info-2)}
  @media (max-width:980px){body.avec-ap .cal-corps{grid-template-columns:1fr}body.avec-ap .ap{position:static;max-height:none;padding:0 22px 10px;order:-1}}
  @media (max-width:700px){
    body.avec-ap .ap{padding:0 16px 10px}
    .barre{flex-wrap:wrap;gap:8px;padding:10px 16px}
    .barre h1{font-size:16px}
    .hub{padding:12px 16px 2px}
    .tuiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .tuile .v{font-size:19px}
    .pages{grid-template-columns:1fr}
    .sec-tete{padding:14px 16px 0}
    .vues{padding:14px 16px 0}
    .cal-tete{flex-wrap:nowrap;min-width:0}
    .cal-tete #periode{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .cal-info{padding:8px 16px 0}
    .cal{padding:10px 16px 24px;gap:8px}
    .jour{min-height:0}
    .jour.passe .liste .vide{display:none}
  }
</style>
</head>
<body>
<header class="barre">
  <a class="retour" href="./">← Téléphones</a>
  <h1>Hub</h1>
  <div class="choix-projet" id="choix-projet" title="Le projet regardé : hub, vues des pages et calendrier"></div>
  <div class="grow"></div>
  <a class="btn" href="warmup">🔥 Warm-up</a>
  <a class="btn" href="./">📱 Téléphones</a>
</header>
<section class="hub" id="hub">
  <div class="tuiles" id="h-tuiles"><div class="tuile"><div class="k">Chargement…</div></div></div>
  <div class="hub-corps">
    <div class="pages" id="h-pages"></div>
    <aside class="alertes"><h2>Alertes · 48 h</h2><div id="h-alertes"></div></aside>
  </div>
  <div class="hub-actions" id="h-actions"></div>
</section>
<section class="vues" id="vues">
  <div class="vues-tete"><h2>Vues des pages</h2><span class="muted small" id="v-resume"></span></div>
  <div id="v-corps"><div class="muted small">Chargement…</div></div>
</section>
<div class="sec-tete">
  <h2>Calendrier</h2>
  <button class="btn" id="corbeille">🗑 Corbeille</button>
  <div class="cal-tete">
    <button class="btn" id="prec" title="Semaine précédente">◀</button>
    <button class="btn" id="auj">Cette semaine</button>
    <button class="btn" id="suiv" title="Semaine suivante">▶</button>
    <b id="periode"></b>
  </div>
</div>
<div class="cal-info" id="info"></div>
<div class="cal-corps"><div class="cal" id="cal"></div><aside class="ap" id="ap"></aside></div>
<div class="fiche-cal" id="fiche" hidden><div class="boite" id="boite"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="i/calendrier.js"></script>
<script src="i/hub.js"></script>
<script src="i/vues.js"></script>
</body>
</html>
